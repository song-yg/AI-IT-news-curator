# feed-livestock-news-curator용 GKG 7일치 제목 매칭 테스트 - 수집 결과 출력만(메일/저장/커밋 없음).
name: 축산 GKG 7일 테스트

on:
  push:
    branches: [test/feed-gkg-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - run: |
          python -u - <<'PY'
          from datetime import datetime, timedelta, timezone
          from collections import Counter
          import gkg_collector
          # feed 저장소 KEYWORDS_EN + 최근 결과의 matched_keywords(영문) + state 파일 키워드
          kws = ["African swine fever", "ASF", "avian influenza", "bird flu", "bovine spongiform encephalopathy", "bovine tuberculosis", "brucellosis", "BSE", "classical swine fever", "FMD", "foot-and-mouth disease", "lumpy skin disease", "Newcastle disease", "PED", "porcine epidemic diarrhea", "porcine reproductive and respiratory syndrome", "compound feed", "corn futures", "farm-gate price", "feed cost", "feed ingredients", "feed price", "feed self-sufficiency rate", "formula feed", "global grain market", "grain price", "grain self-sufficiency rate", "livestock exports", "livestock imports", "livestock supply and demand", "mixed feed", "SBM", "soybean futures", "soybean meal", "wheat futures", "Animal and Plant Quarantine Agency", "animal welfare certification", "antibiotic-free livestock products", "biosecurity", "livestock manure", "livestock movement restriction", "livestock traceability system", "Ministry of Agriculture, Food and Rural Affairs", "Protection Zone", "standstill order", "Surveillance Zone", "beef cattle", "broiler", "dairy cattle", "dairy farming", "egg supply", "Korean native cattle", "laying hens", "livestock industry", "pig farming", "poultry industry", "swine industry", "animal feed", "feed manufacturer", "feed mill", "feed producer", "grain elevator", "livestock feed", "nutrition company", "premix", "roughage", "Total Mixed Ration", "AMR", "antibiotic growth promoter", "antibiotic-free feed", "antimicrobial resistance", "Control of Livestock and Fish Feed Act", "feed additive", "feed enzyme", "feed supplement", "methionine", "phytase", "reduction of antibiotic use", "veterinary drugs", "livestock import tariff", "contract farmer", "contract grower", "guarantee of production cost", "poultry vertical integration", "vertical integrator", "livestock automation", "livestock big data", "precision livestock farming", "smart farming"]
          end = datetime.now(timezone.utc).replace(minute=0, second=0, microsecond=0)
          arts = gkg_collector.collect(kws, end - timedelta(days=7), end)
          print("언론사 상위:", Counter(a["press"] for a in arts).most_common(10))
          for a in arts[:25]:
              print(f"  - {a['published_at'][:16]} | {a['press']} | {a['title'][:95]}")
          PY

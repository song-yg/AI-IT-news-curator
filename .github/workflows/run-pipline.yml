# AI-IT 큐레이션 파이프라인 - workflow
#
# (알고리즘 문서 "6. 실행/오케스트레이션" / "8. GitHub Actions 유의사항" 참조)
#
# 트리거는 두 가지:
#   1. workflow_dispatch(수동 버튼) - 테스트/임시 확인용.
#      실행 시 memo를 입력하면 Actions 목록 화면의 실행 이름과 실행 상세 페이지 요약에 바로 남아서,
#      나중에 "이 회차가 뭘 확인하려던 실행이었는지" 코드를 안 열어봐도 바로 알 수 있다.
#   2. schedule(매일 새벽 자동) - 실제 "오늘 정식 큐레이션"은 이걸로. 전날(윈도우 기준
#      "어제 00:00 KST ~ 오늘 00:00 KST") 기사를 수집해서 발송한다.
#      on: push는 의도적으로 안 씀 - 이 파이프라인은 실행될 때마다 실제 이메일 발송 + LLM 호출량(일일 한도 있는 프로바이더 포함) 소모 + 데이터 커밋이 일어나서,
#      단순 코드 수정 커밋마다 전체가 돌아버리면 테스트/실제 실행이 뒤섞이는 문제가 생김.
#
# ** Job 체이닝(2-Job 구조) **
# GitHub Actions Job 하나는 최대 6시간(360분)까지만 돌 수 있는데, 예전엔 이 6시간 안에
# 수집~배포 전 단계를 다 우겨넣고 355분(체크포인트 5단계) 예산을 쪼개 썼다. 지금은 Job을
# 둘로 쪼개서 각자 자기 몫의 6시간을 독립적으로 쓴다(collect_stage.py/process_stage.py 참고):
#   - collect Job: 네이버+GDELT 수집만. GDELT가 350분(5시간 50분)을 혼자 다 씀(COLLECT_TIME_BUDGET_SECONDS).
#     결과를 collected.json으로 만들어 artifact로 올림.
#   - process Job: collect Job의 artifact를 받아 정규화~배포. 관련성 필터/카테고리
#     재분류에만 이 Job 시작 후 4시간(RELEVANCE_TIME_BUDGET_SECONDS)을 주고, 나머지
#     (그룹핑/4차 재검토/요약)는 시간예산 없이(무제한) 돈다 - TOP_N이 고정값이라 수집량과
#     무관하게 규모가 안 커져서 상대적으로 안전하다고 판단.
# collect Job이 실패해도 process Job은 그래도 돈다(아래 `if: always()` 참고) - 빈 기사로
# 그날 실행이 통째로 없어지는 대신 "오늘은 기사 0건"으로 안전하게 흘러가게 함.
#
# 실행 방법: GitHub 리포 > Actions 탭 > "AI-IT 큐레이션 파이프라인 실행" 선택 > "Run workflow" 버튼 클릭 > 메모(선택) 입력 후 실행
# 로그 확인: 같은 화면에서 실행 중인 job을 클릭하면 각 step의 로그가 실시간으로 스트리밍됩니다.

name: AI-IT 큐레이션 파이프라인 실행

# Actions 목록 화면에서 각 실행이 무슨 목적이었는지 바로 보이도록 회차 번호 + 메모를 실행 이름에 반영.
# workflow_dispatch로 memo를 입력하면 그 값이, 입력 안 하면 memo input 자체의 기본값("수동 실행 메모 없음")이 쓰이고,
# schedule(자동 실행)로 돌면 inputs 자체가 없으므로 "자동 스케줄 실행"으로 표시된다.
run-name: "회차 #${{ github.run_number }}: ${{ inputs.memo || '자동 스케줄 실행' }}"

on:
  workflow_dispatch:
    inputs:
      memo:
        description: '이번 회차에 남길 메모(선택) - Actions 목록/실행 요약에 표시됨'
        required: false
        default: '수동 실행 메모 없음'
  schedule:
    # 매일 자정 1분 KST(전날 15:01 UTC) - cron은 UTC 기준
    # 정각(00:00) 대신 1분을 준 건 GitHub Actions 스케줄이 정각에 몰리는 워크플로가 많아
    # 큐 지연이 잦다고 알려져 있어서, 그 시각을 살짝 피해가려는 것.
    - cron: "1 15 * * *"

concurrency:
  # group을 workflow 이름으로 고정해서, 같은 workflow가 이미 돌고 있으면 새 실행이 그걸 기다리지 않고 취소하도록 함 (cancel-in-progress: true)
  # - 이 파이프라인은 몇 시간씩 걸릴 수 있어서 대기시키기보다는, 나중에 시작한 실행이 이기고 먼저 것은 취소되는 편이 낫다고 판단.
  # collect/process 두 Job이 같은 workflow run에 속해있으므로 이 설정 하나로 둘 다 같이 취소됨.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    # GitHub 호스팅 러너 Job 하드 캡(GitHub 인프라 자체의 캡, 워크플로 설정으로 못 늘림)
    # 그대로 360분 - GDELT 자체 예산은 350분(collect_stage.COLLECT_TIME_BUDGET_SECONDS)이라
    # 체크아웃/의존성 설치/state 커밋 몫으로 10분 버퍼가 남음.
    timeout-minutes: 360
    permissions:
      contents: write
      # state/gdelt_skip_keywords.json 등 학습형 상태 파일을 이 Job이 직접 커밋/푸시하려면 필요.

    steps:
      - name: 리포 체크아웃
        uses: actions/checkout@v4

      - name: 실행 메모 기록
        run: |
          echo "## 📝 실행 메모" >> "$GITHUB_STEP_SUMMARY"
          echo "- **회차:** #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **트리거:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **메모:** ${{ inputs.memo || '(자동 스케줄 실행 - 메모 없음)' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
        # 이 Job은 BGE-M3/PyTorch(정규화 이후 단계에서만 필요)를 안 쓰므로 process Job에
        # 있는 "PyTorch CPU 전용 우선 설치"/"BGE-M3 캐시" 스텝이 여기엔 없음 - requirements.txt
        # 전체를 그대로 설치해도(간단함 우선) 무거운 ML 패키지가 실제로 안 쓰이면 설치
        # 시간만 좀 더 들 뿐 실행 자체엔 영향 없음(추후 collect 전용 requirements로
        # 분리하면 이 Job은 더 가벼워질 여지가 있음 - 지금은 안 함).

      - name: 파이썬 의존성 설치
        run: pip install -r requirements.txt --no-cache-dir

      - name: 수집 실행 (collect_stage.py)
        env:
          # --- 필수: 네이버 뉴스 검색 API (naver_collector.py) ---
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # --- 선택: 구글 시트 키워드 연동 (keyword_source.py, naver+gdelt 공용) ---
          KEYWORD_SHEET_CSV_URL: ${{ vars.KEYWORD_SHEET_CSV_URL }}
        run: python -u collect_stage.py

      - name: 수집 결과 업로드 (process Job이 이어받음)
        # 이 workflow run 안에서만 쓰고 버릴 데이터라 보존 기간을 짧게(1일) 잡음.
        # if-no-files-found: warn - collect_stage.py가 파일 저장까지 실패한 극단적 경우
        # (디스크 문제 등)에도 이 스텝 자체가 워크플로 전체를 실패 처리하면 안 되므로 경고만.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collected-data-${{ github.run_id }}
          path: collect_output/collected.json
          if-no-files-found: warn
          retention-days: 1

      - name: state/ 커밋 & 푸시
        # gdelt_collector.py의 학습형 스킵/크라우딩 목록(state/*.json) - 날짜 무관하게
        # 계속 누적되는 파이프라인 자체의 학습 상태라, data/(날짜별 아카이브, process Job이
        # 커밋)와 성격이 달라 collect Job이 직접 커밋한다. 다음 실행에 이어지려면 여기서
        # 커밋해둬야 함(러너는 매번 완전히 새 VM이라 커밋 안 하면 이 Job이 끝나며 사라짐).
        # push 충돌 방지(git pull --rebase) 로직은 process Job의 동일 스텝과 같은 이유 -
        # 그쪽 주석 참고.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d state/ ]; then
            git add state/
          fi
          if git diff --cached --quiet; then
            echo "state/ 변경 사항 없음 - 커밋 생략"
          else
            git commit -m "chore: GDELT 학습 상태 갱신 ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi

  process:
    needs: collect
    # collect Job이 실패해도 이 Job은 그래도 돈다 - needs만 걸면 앞 Job이 실패했을 때
    # 기본적으로 skip되는데, 그러면 그날 발송 자체가 통째로 없어진다. process_stage.py가
    # collected.json이 없거나 손상된 경우를 스스로 방어(빈 articles로 시작)하므로, 이
    # Job은 항상 시도해보는 쪽이 안전하다(collect_stage.py 상단 독스트링 "실패해도 절대
    # 죽지 않는다" 참고).
    if: always()
    runs-on: ubuntu-latest
    # 관련성 필터(4시간, process_stage.py의 RELEVANCE_TIME_BUDGET_SECONDS)만 예산이 있고
    # 나머지(그룹핑/4차 재검토/요약)는 무제한이라 이론적으로는 6시간을 넘길 수도 있는
    # 구조지만, Job 하드 캡 자체는 여전히 6시간이라 timeout-minutes도 그에 맞춤 - 실제로
    # 이 캡에 걸리면 그룹핑/요약 중간에 강제 종료될 수 있다는 점은 감안할 것(TOP_N 고정값
    # 특성상 위험은 낮다고 보고 있음 - 위 상단 주석 참고).
    timeout-minutes: 360
    permissions:
      contents: write
      # 저장 레이어(5단계) 결과물(data/YYYY-MM-DD/)을 리포에 커밋/푸시하려면 필요.

    steps:
      - name: 리포 체크아웃
        uses: actions/checkout@v4
        # collect Job이 이미 state/를 커밋해둔 뒤라, 여기서 새로 체크아웃하면 그 커밋을
        # 그대로 받아온다(needs: collect가 순서를 보장) - 별도 조치 필요 없음.

      - name: 실행 전 디스크 사용량 확인
        run: df -h /

      - name: 사용 안 하는 프리인스톨 툴 정리 (디스크 확보)
        # "No space left on device" 실패 원인 대응.
        # GitHub-hosted ubuntu-latest 러너는 실행마다 완전히 새 VM을 쓰므로 "여러 번 실행해서 누적된 것"이 아니라,
        # 이 Job 한 번 실행에 필요한 용량(PyTorch+BGE-M3)이 러너의 보장 여유 공간(14GB)에 비해 크다는 게 진짜 원인.
        # .NET/Android SDK/GHC 등 이 프로젝트(Python 전용)에 전혀 안 쓰는 프리인스톨 툴을 먼저 지워서 여유를 만든다.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean
          echo "정리 후 디스크 사용량:"
          df -h /

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: PyTorch(CPU 전용) 우선 설치 - CUDA 휠 다운로드 방지
        # sentence-transformers가 아무 설정 없이 설치되면 GPU(CUDA)용 PyTorch가 딸려오는데, 이 CUDA 라이브러리들이 수 GB로 커서 디스크 부족의 가장 큰 원인이었음.
        # 이 프로젝트는 BGE-M3를 CPU로만 돌리므로 CPU 전용 휠을 먼저 깔아두면, 이어지는
        # requirements.txt 설치에서 sentence-transformers가 이미 설치된 torch를 그대로 쓰고 GPU 버전을 새로 안 받는다.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: 파이썬 의존성 설치
        run: pip install -r requirements.txt --no-cache-dir

      - name: 한글 폰트(fonts-nanum) 설치 + apt 캐시 정리 + 설치 후 디스크 사용량 확인
        # category_chart.py가 matplotlib으로 카테고리별 7일 추이 그래프를 그리는데, 이
        # 러너엔 한글 폰트가 기본 설치돼 있지 않아 카테고리명이 네모(tofu)로 깨져 나온다 -
        # fonts-nanum을 깔아두면 category_chart._find_korean_font()가 찾아서 쓴다.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-nanum
          fc-cache -f
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "의존성 설치 후 디스크 사용량:"
          df -h /

      - name: BGE-M3 임베딩 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bge-m3-model

      - name: 수집 결과 다운로드 (collect Job이 만든 것)
        # collect Job이 실패해서 artifact 자체가 없을 수도 있다(위 collect Job의
        # if-no-files-found: warn 참고) - continue-on-error로 이 스텝 자체의 실패가
        # process Job을 막지 않게 하고, process_stage.py가 collect_output/collected.json이
        # 없는 경우를 스스로 감지해 빈 articles로 안전하게 시작한다.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: collected-data-${{ github.run_id }}
          path: collect_output

      - name: 정규화~배포 실행 (process_stage.py)
        env:
          # --- 3차 LLM 그룹핑 보조 / 관련성 필터 / 요약 공통 (openrouter만 사용) ---
          # OPENROUTER_MODEL_2/3는 선택사항 - 1순위 모델이 실패했을 때 자동으로 시도되는
          # 2/3순위 폴백 모델(issue_grouper.py/relevance_filter.py/llm_summarizer.py 공통
          # 체인, 1순위->2순위->3순위->최종 안전망 순). 여기 env로 넘겨주지 않으면 리포
          # Variables에 값을 등록해도 파이썬 프로세스 입장에선 아예 안 보임(os.environ에
          # 없는 값 취급)에 주의.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_MODEL_2: ${{ vars.OPENROUTER_MODEL_2 }}
          OPENROUTER_MODEL_3: ${{ vars.OPENROUTER_MODEL_3 }}
          # 6단계(deploy.py) 이메일 발송용. SMTP_USER/SMTP_APP_PASSWORD는 민감정보라 Secrets로, EMAIL_RECIPIENTS는 수신자 목록이라 마찬가지로 Secrets에 등록.
          # 셋 다 미등록이어도 deploy.py가 안전하게 발송만 생략하므로 파이프라인 자체는 안 죽음.
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python -u process_stage.py

      - name: 유사도 디버그 CSV 업로드 (그룹핑 임계값 튜닝용)
        # THRESHOLD/BORDERLINE_MARGIN을 눈으로 보고 직접 조정.
        # issue_grouper.export_similarity_scores()가 만든 similarity_debug/similarity_scores.csv를 GitHub Actions 아티팩트로 업로드한다.
        # data/ 아래 git commit은 안 함 - 매일 쌓아둘 "공식 산출물"이 아니라 임계값 튜닝이
        # 끝나면 더 이상 필요 없는 일회성 진단용 파일이라, 리포 히스토리를 불필요하게 늘리지
        # 않으려고 Actions 아티팩트(보존 기간 지나면 자동 삭제)로만 남김.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: similarity-debug-${{ github.run_id }}
          path: similarity_debug/similarity_scores.csv
          if-no-files-found: warn
          retention-days: 14

      - name: 저장 결과물(data/) 커밋 & 푸시
        # storage.py가 data/YYYY-MM-DD/에 raw.json/scored.json/summary.md를 만들어도, 이 스텝이 없으면 GitHub-hosted 러너가 실행 끝나고 통째로 폐기되면서 파일도 같이 사라진다.
        # data/ 폴더를 "오늘 결과물 아카이브"이자 "다음 날 전일/7일 평균 대비 증감 비교의 재료"로 쓰려면 반드시 리포에 커밋까지 해야 함.
        # state/는 collect Job이 이미 자기 커밋에서 처리했으므로 여기선 data/만 다룸.
        # 변경 사항이 없으면(예: process_stage.py가 도중에 실패해 data/ 갱신이 없는 경우) commit이 빈 커밋이 되지 않도록 diff 확인 후 조건부로 실행.
        #
        # push가 "! [rejected] main -> main (fetch first)"로 실패하는 사고 실측 확인.
        # - 체크아웃(job 시작 시점) 이후 원격 main에 이 job이 모르는 새 커밋이 생겨서(예: collect Job의 state/ 커밋, 또는 같은 파이프라인을 겹쳐 실행) non-fast-forward로 거부됨.
        # push 직전에 git pull --rebase로 원격 변경사항을 먼저 반영해서 최신 위에 이 커밋을 얹도록 수정.
        # rebase 자체가 충돌나면 (예: 같은 날짜 파일을 동시에 건드린 경우) 사람이 봐야 하므로 자동 해결은 시도하지 않고 그대로 실패시킨다.
        # `if` 문으로 명확하게 감싸야 조건이 거짓이어도 스크립트가 안 죽는다(`cmd1 && cmd2`
        # 방식은 `bash -e`에서 cmd1 실패 시 set -e가 스크립트를 즉시 중단시키는 함정이 있음).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d data/ ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "data/ 변경 사항 없음 - 커밋 생략"
          else
            git commit -m "chore: AI·IT 뉴스 큐레이션 결과 저장 ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
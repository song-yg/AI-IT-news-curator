# AI-IT 큐레이션 파이프라인 workflow.
#
# 트리거: workflow_dispatch(수동, 테스트용) / schedule(매일 자정 1분 KST, 정식 실행).
# on: push는 안 씀 - 커밋마다 이메일 발송/LLM 호출/데이터 커밋이 도는 걸 피하기 위함.
#
# AUTO_RUN_ENABLED(리포 Variables)를 off/0으로 하면 스케줄 실행만 스킵(수동 실행은 무관하게 항상 돎).
#
# Job 체이닝(collect + process 2-Job) - Job 하나가 GitHub Actions 하드 캡 6시간이라 GDELT
# 수집(collect)과 정규화~배포(process)를 분리해서 각자 자기 몫의 6시간을 쓴다. collect
# 실패해도 process는 그대로 돎(빈 기사로 "오늘은 0건"으로 안전하게 흘러감).

name: AI-IT 큐레이션 파이프라인 실행

run-name: "회차 #${{ github.run_number }}: ${{ inputs.memo || '자동 스케줄 실행' }}"

on:
  workflow_dispatch:
    inputs:
      memo:
        description: '이번 회차에 남길 메모(선택)'
        required: false
        default: '수동 실행 메모 없음'
  schedule:
    - cron: "1 15 * * *"  # 매일 00:01 KST(전날 15:01 UTC)

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || (vars.AUTO_RUN_ENABLED != 'off' && vars.AUTO_RUN_ENABLED != '0') }}
    timeout-minutes: 360
    permissions:
      contents: write  # state/ 커밋용

    steps:
      - name: 리포 체크아웃
        uses: actions/checkout@v4

      - name: 실행 메모 기록
        run: |
          echo "## 📝 실행 메모" >> "$GITHUB_STEP_SUMMARY"
          echo "- **회차:** #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **트리거:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **메모:** ${{ inputs.memo || '(자동 스케줄 실행 - 메모 없음)' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 파이썬 의존성 설치
        run: pip install -r requirements.txt --no-cache-dir

      - name: 수집 실행 (collect_stage.py)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KEYWORD_SHEET_CSV_URL: ${{ vars.KEYWORD_SHEET_CSV_URL }}
        run: python -u collect_stage.py

      - name: 수집 결과 업로드 (process Job이 이어받음)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collected-data-${{ github.run_id }}
          path: collect_output/collected.json
          if-no-files-found: warn
          retention-days: 1

      - name: state/ 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d state/ ]; then
            git add state/
          fi
          if git diff --cached --quiet; then
            echo "state/ 변경 사항 없음 - 커밋 생략"
          else
            git commit -m "chore: GDELT 학습 상태 갱신 ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi

  process:
    needs: collect
    # !cancelled() - always()는 워크플로 수동 취소 시에도 계속 돌아버림(GH 공식 동작).
    # collect가 AUTO_RUN_ENABLED로 skip돼도(스킵≠취소) 같이 skip되도록 조건 반복.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || (vars.AUTO_RUN_ENABLED != 'off' && vars.AUTO_RUN_ENABLED != '0')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write  # data/ 커밋용

    steps:
      - name: 리포 체크아웃
        uses: actions/checkout@v4

      - name: 실행 전 디스크 사용량 확인
        run: df -h /

      - name: 사용 안 하는 프리인스톨 툴 정리 (디스크 확보)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean
          echo "정리 후 디스크 사용량:"
          df -h /

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: PyTorch(CPU 전용) 우선 설치 - CUDA 휠 다운로드 방지
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: 파이썬 의존성 설치
        run: pip install -r requirements.txt --no-cache-dir

      - name: 한글 폰트(fonts-nanum) 설치 + apt 캐시 정리 + 디스크 사용량 확인
        # category_chart.py 그래프의 카테고리명이 안 깨지도록 나눔고딕 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-nanum
          fc-cache -f
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "의존성 설치 후 디스크 사용량:"
          df -h /

      - name: BGE-M3 임베딩 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bge-m3-model

      - name: 수집 결과 다운로드 (collect Job이 만든 것)
        continue-on-error: true  # collect 실패로 artifact 없어도 process_stage.py가 빈 articles로 방어
        uses: actions/download-artifact@v4
        with:
          name: collected-data-${{ github.run_id }}
          path: collect_output

      - name: 정규화~배포 실행 (process_stage.py)
        env:
          KEYWORD_SHEET_CSV_URL: ${{ vars.KEYWORD_SHEET_CSV_URL }}
          LLM_ENABLED: ${{ vars.LLM_ENABLED }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_MODEL_2: ${{ vars.OPENROUTER_MODEL_2 }}
          OPENROUTER_MODEL_3: ${{ vars.OPENROUTER_MODEL_3 }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python -u process_stage.py

      - name: 유사도 디버그 CSV 업로드 (그룹핑 임계값 튜닝용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: similarity-debug-${{ github.run_id }}
          path: similarity_debug/similarity_scores.csv
          if-no-files-found: warn
          retention-days: 14

      - name: 저장 결과물(data/) 커밋 & 푸시
        # push 직전 pull --rebase로 원격 변경(예: collect의 state/ 커밋) 반영 후 push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d data/ ]; then
            git add data/
          fi
          if git diff --cached --quiet; then
            echo "data/ 변경 사항 없음 - 커밋 생략"
          else
            git commit -m "chore: AI·IT 뉴스 큐레이션 결과 저장 ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
# AI-IT 큐레이션 파이프라인 - workflow
#
# (알고리즘 문서 "6. 실행/오케스트레이션" / "8. GitHub Actions 유의사항" 참조)
#
# 트리거는 두 가지:
#   1. workflow_dispatch(수동 버튼) - 테스트/임시 확인용.
#      실행 시 memo를 입력하면 Actions 목록 화면의 실행 이름과 실행 상세 페이지 요약에 바로 남아서,
#      나중에 "이 회차가 뭘 확인하려던 실행이었는지" 코드를 안 열어봐도 바로 알 수 있다.
#   2. schedule(매일 새벽 자동) - 실제 "오늘 정식 큐레이션"은 이걸로. 전날(DAYS_BACK=1)
#      기사를 수집해서 발송한다(예전엔 주 1회 실행 + 7일치 수집이었음 - 일간 전환).
#      on: push는 의도적으로 안 씀 - 이 파이프라인은 실행될 때마다 실제 이메일 발송 + LLM 호출량(일일 한도 있는 프로바이더 포함) 소모 + 데이터 커밋이 일어나서,
#      단순 코드 수정 커밋마다 전체가 돌아버리면 테스트/실제 실행이 뒤섞이는 문제가 생김.
#
# 실행 방법: GitHub 리포 > Actions 탭 > "AI-IT 큐레이션 파이프라인 실행" 선택 > "Run workflow" 버튼 클릭 > 메모(선택) 입력 후 실행
# 로그 확인: 같은 화면에서 실행 중인 job을 클릭하면 각 step의 로그가 실시간으로 스트리밍됩니다 (main.py의 print 출력이 그대로 보임).

name: AI-IT 큐레이션 파이프라인 실행

# Actions 목록 화면에서 각 실행이 무슨 목적이었는지 바로 보이도록 회차 번호 + 메모를 실행 이름에 반영.
# workflow_dispatch로 memo를 입력하면 그 값이, 입력 안 하면 memo input 자체의 기본값("수동 실행 메모 없음")이 쓰이고,
# schedule(자동 실행)로 돌면 inputs 자체가 없으므로 "자동 스케줄 실행"으로 표시된다.
run-name: "회차 #${{ github.run_number }}: ${{ inputs.memo || '자동 스케줄 실행' }}"

permissions:
  contents: write  
  # 저장 레이어(5단계) 결과물(data/YYYY-MM-DD/)을 리포에 커밋/푸시하려면 필요.
  # 기본 GITHUB_TOKEN은 리포 설정에 따라 read-only일 수 있어 명시적으로 write 권한을 준다.

on:
  workflow_dispatch:
    inputs:
      memo:
        description: '이번 회차에 남길 메모(선택) - Actions 목록/실행 요약에 표시됨'
        required: false
        default: '수동 실행 메모 없음'
  schedule:
    # 매일 새벽 4시 KST(전날 19:00 UTC) - cron은 UTC 기준
    # (예전엔 "매주 월요일 00:00 UTC"였음 - 일간 전환하면서 변경. 새벽 시간대로 잡은 이유:
    # 전날 하루치 뉴스가 대부분 마감된 뒤에 돌아야 "전날 기사"라는 취지에 맞고, 업무 시간과
    # 안 겹쳐서 GDELT 429 등 외부 API 혼잡도도 상대적으로 낮을 걸로 기대)
    - cron: "0 19 * * *"

concurrency:
  # group을 workflow 이름으로 고정해서, 같은 workflow가 이미 돌고 있으면 새 실행이 그걸 기다리지 않고 취소하도록 함 (cancel-in-progress: true)
  # - 이 파이프라인은 몇 시간씩 걸릴 수 있어서 대기시키기보다는, 나중에 시작한 실행이 이기고 먼저 것은 취소되는 편이 낫다고 판단.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # GitHub 호스팅 러너(ubuntu-latest)는 작업 하나당 최대 360분(6시간)이 하드 제한이라(GitHub 인프라 자체의 캡, 워크플로 설정으로 못 늘림), 그 이상 적어도 의미가 없어 360으로 맞춤.
    # main.py의 파이프라인 체크포인트 예산(GDELT~LLM요약 합계 355분, PIPELINE_TIME_BUDGET_SECONDS 참고)이
    # 이 360분에서 나온 값 - 체크아웃/디스크 정리/의존성 설치/BGE-M3 캐시/네이버 수집(예산 추적 전)과
    # 저장/배포/git 커밋·푸시(예산 추적 후)를 합쳐 5분 안에 끝나야 하는 빠듯한 구조이니, 실제로 이
    # 여유 밖 단계들이 5분을 넘기면 job 자체가 타임아웃으로 죽을 수 있다는 점은 감안할 것.
    # 만약 실제로 6시간을 넘겨야 하는 상황이 온다면 self-hosted 러너로 전환해야 함(이 제한이 없어짐 - 대신 24시간 켜둘 서버/PC가 별도로 필요).
    timeout-minutes: 360

    steps:
      - name: 리포 체크아웃
        uses: actions/checkout@v4

      - name: 실행 메모 기록
        # 실행 상세 페이지 맨 위에 마크다운으로 남는 요약(Job Summary)
        # - 나중에 이 회차 로그를 다시 찾아볼 때, 로그를 다 안 열어봐도 "이번 실행이 뭘 확인하려던 건지"가 여기 바로 보이게 함.
        run: |
          echo "## 📝 실행 메모" >> "$GITHUB_STEP_SUMMARY"
          echo "- **회차:** #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **트리거:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **메모:** ${{ inputs.memo || '(자동 스케줄 실행 - 메모 없음)' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: 실행 전 디스크 사용량 확인
        run: df -h /

      - name: 사용 안 하는 프리인스톨 툴 정리 (디스크 확보)
        # "No space left on device" 실패 원인 대응.
        # GitHub-hosted ubuntu-latest 러너는 실행마다 완전히 새 VM을 쓰므로 "여러 번 실행해서 누적된 것"이 아니라,
        # 이 파이프라인 한 번 실행에 필요한 용량(PyTorch+BGE-M3+Playwright) 자체가 러너의 보장 여유 공간(14GB)에 비해 크다는 게 진짜 원인.
        # .NET/Android SDK/GHC 등 이 프로젝트(Python 전용)에 전혀 안 쓰는 프리인스톨 툴을 먼저 지워서 여유를 만든다.
        # (안전하게 삭제 가능한 것으로 알려진 경로만 대상 - 삭제 실패해도 파이프라인이 안 죽도록 || true 처리)

        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean
          echo "정리 후 디스크 사용량:"
          df -h /

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"  # requirements.txt 해시 기준으로 pip 캐시 자동 관리

      - name: PyTorch(CPU 전용) 우선 설치 - CUDA 휠 다운로드 방지
        # sentence-transformers가 아무 설정 없이 설치되면 GPU(CUDA)용 PyTorch가 딸려오는데, 이 CUDA 라이브러리들이 수 GB로 커서 디스크 부족의 가장 큰 원인이었음.
        # 이 프로젝트는 BGE-M3를 CPU로만 돌리므로(2.1 섹션 "GPU 불필요" 명시) CPU 전용 휠을 먼저 깔아두면,
        # 이어지는 requirements.txt 설치에서 sentence-transformers가 이미 설치된 torch를 그대로 쓰고 GPU 버전을 새로 안 받는다.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: 파이썬 의존성 설치
        run: pip install -r requirements.txt --no-cache-dir

      - name: apt 캐시 정리 + 설치 후 디스크 사용량 확인
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "의존성 설치 후 디스크 사용량:"
          df -h /

      - name: BGE-M3 임베딩 모델 캐시
        # 2.1 이슈 그룹핑 섹션에 명시된 캐싱 설정 그대로 - 최초 1회만 약 2.2GB를 받고, 이후 실행부터는 캐시에서 즉시 로드됨
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bge-m3-model

      - name: 파이프라인 실행 (main.py)
        env:
          # --- 필수: 네이버 뉴스 검색 API (naver_collector.py) ---
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

          # --- 선택: 구글 시트 키워드 연동 (keyword_source.py) ---
          # 키워드를 편하게 추가/수정할 수 있게 구글 시트를 키워드 소스로 쓸 수 있게 함.
          # 시트를 "파일 > 공유 > 웹에 게시 > CSV"로 게시한 뒤 그 URL을 아래 Variable에 등록.
          # 비워두면(또는 시트 읽기 실패 시) 각 collector의 기존 하드코딩 키워드 리스트로 안전하게 대체됨
          # - 이 값이 없어도 파이프라인은 그대로 정상 동작함.
          KEYWORD_SHEET_CSV_URL: ${{ vars.KEYWORD_SHEET_CSV_URL }}

          # --- 3차 LLM 그룹핑 보조 (issue_grouper.py) ---
          # 아래 세 값을 채우면 LLM_PROVIDER=openrouter로 3차를 실행할 수 있습니다.
          #
          # 참고: OPENROUTER_MODEL을 리포 Variables에 등록 안 해도 이 줄 자체는 그대로 둬도 안전합니다
          # - GitHub가 미등록 vars를 빈 문자열로 넘기는 걸 issue_grouper.py가 감지해서 기본값(openrouter/free)으로 자연스럽게 대체하도록 수정함.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          # 6단계(deploy.py) 이메일 발송용. SMTP_USER/SMTP_APP_PASSWORD는 민감정보라 Secrets로, EMAIL_RECIPIENTS는 수신자 목록이라 마찬가지로 Secrets에 등록.
          # (이메일 주소도 개인정보로 취급 - Variables는 리포 권한 있는 사람 누구나 값이 노출되니 이쪽이 더 안전).
          # 셋 다 미등록이어도 deploy.py가 안전하게 발송만 생략하므로 파이프라인 자체는 안 죽음.
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        # -u: 파이썬 stdout 버퍼링 비활성화.
        # 이게 없으면 print()가 터미널이 아닌 곳(이 로그 파이프)에 출력될 때 기본적으로 블록 단위로 버퍼링돼서, 실제로는 진행 중인데 로그에 한동안 아무것도 안 뜨다가 나중에 한꺼번에 쏟아지는 것처럼 보이는 문제.
        # -u를 주면 print()가 매번 즉시 flush돼서 실행 상태를 실시간으로 볼 수 있다.
        run: python -u main.py

      - name: 유사도 디버그 CSV 업로드 (그룹핑 임계값 튜닝용)
        # THRESHOLD/BORDERLINE_MARGIN을 눈으로 보고 직접 조정.
        # issue_grouper.export_similarity_scores()가 만든 similarity_debug/similarity_scores.csv를 GitHub Actions 아티팩트로 업로드한다.
        # raw.json/scored.json/summary.md와 달리 data/ 아래 git commit은 안 함
        # - 이건 매일 쌓아둘 "공식 산출물"이 아니라 임계값 튜닝이 끝나면 더 이상 필요 없는 일회성 진단용 파일이라, 리포 히스토리를 불필요하게 늘리지 않으려고 Actions 아티팩트(보존 기간 지나면 자동 삭제)로만 남김.
        # if-no-files-found: warn - main.py가 도중에 실패해서 이 파일 자체가 안 만들어졌을 수 있는데, 그런 경우에도 아티팩트 업로드 실패로 워크플로 전체가 실패 처리되면 안 되므로 경고만 남기고 넘어가게 함.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: similarity-debug-${{ github.run_id }}
          path: similarity_debug/similarity_scores.csv
          if-no-files-found: warn
          retention-days: 14

      - name: 저장 결과물(data/, state/) 커밋 & 푸시
        # storage.py가 data/YYYY-MM-DD/에 raw.json/scored.json/summary.md를 만들어도, 이 스텝이 없으면 GitHub-hosted 러너가 실행 끝나고 통째로 폐기되면서 파일도 같이 사라진다.
        # (러너는 매번 완전히 새 VM - "8. GitHub Actions 유의사항" 참고).
        # data/ 폴더를 "오늘 결과물 아카이브"이자 "다음 날 전일/7일 평균 대비 증감 비교의 재료"로 쓰려면 반드시 리포에 커밋까지 해야 함.
        # state/gdelt_skip_keywords.json(학습형 스킵 목록, gdelt_collector.py 참고)도 같은 이유로 커밋 대상에 추가 
        # - data/와 성격은 다르지만(날짜 무관, 계속 누적) 마찬가지로 다음 실행에 이어지려면 리포에 남아있어야 함.
        # 변경 사항이 없으면(예: main.py가 도중에 실패해 data/ 갱신이 없는 경우) commit이 빈 커밋이 되지 않도록 diff 확인 후 조건부로 실행.
        #
        # push가 "! [rejected] main -> main (fetch first)"로 실패하는 사고 실측 확인.
        # - 체크아웃(job 시작 시점) 이후 원격 main에 이 job이 모르는 새 커밋이 생겨서(예: 같은 파이프라인을 겹쳐 실행) non-fast-forward로 거부됨.
        # 이 파이프라인은 GDELT 429 백오프 때문에 체크아웃부터 push까지 최대 몇 시간씩 걸릴 수 있어 (job 전체 timeout-minutes: 360), 그 사이 원격이 앞서갈 여지가 충분함.
        # push 직전에 git pull --rebase로 원격 변경사항을 먼저 반영해서 최신 위에 이 커밋을 얹도록 수정.
        # rebase 자체가 충돌나면 (예: 같은 날짜 파일을 동시에 건드린 경우) 사람이 봐야 하므로 자동 해결은 시도하지 않고 그대로 실패시킨다.
        # `[ -d data/ ] && git add data/` 방식도 이 workflow가 `bash -e`로 도는 이상 같은 함정이 남아있음
        # - `cmd1 && cmd2`를 단독 문장으로 쓰면, cmd1(`[ -d data/ ]`)이 실패했을 때 그 실패가 그대로 전체 목록의 실패로 취급돼 `set -e`가 스크립트를 즉시 중단시킴.
        # (`if` 조건절 안에서 실패하는 것과 달리, `&&`/`||` 목록은 set -e의 예외 대상이 아님).
        # `if` 문으로 명확하게 감싸야 조건이 거짓이어도 스크립트가 안 죽는다.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d data/ ]; then
            git add data/
          fi
          if [ -d state/ ]; then
            git add state/
          fi
          if git diff --cached --quiet; then
            echo "data/, state/ 변경 사항 없음 - 커밋 생략"
          else
            git commit -m "chore: AI·IT 뉴스 큐레이션 결과 저장 ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi